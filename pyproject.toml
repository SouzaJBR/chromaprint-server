[project]
name = "chromaprint-server"
version = "0.1.0"
description = "HTTP API for generating Chromaprint fingerprints from audio URLs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.12,<1",
    "pyacoustid>=1.3.0,<2",
    "python-dotenv>=1.1.0,<2",
    "uvicorn[standard]>=0.34.2,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "pytest>=9.1.1,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
